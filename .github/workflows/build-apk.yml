name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf libtool pkg-config zlib1g-dev libncurses5-dev libffi-dev libssl-dev cmake git zip unzip openjdk-17-jdk

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Build APK
        run: |
          printf '[app]\ntitle = FocusPods\npackage.name = focuspods\npackage.domain = org.example\nsource.dir = .\nsource.include_exts = py,png,jpg,kv,atlas,wav,ttf\nversion = 1.0\nrequirements = python3,kivy==2.3.1\norientation = portrait\nfullscreen = 0\n\n[android]\npermissions = INTERNET, VIBRATE, POST_NOTIFICATIONS\nandroid.api = 30\nandroid.minapi = 21\nandroid.ndk = 25b\nandroid.sdk = 30\nandroid.arch = arm64-v8a\n' > buildozer.spec
          yes | buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: focuspods-apk
          path: bin/*.apk
